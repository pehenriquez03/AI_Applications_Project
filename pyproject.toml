[project]
name = "research-engine"
version = "0.1.0"
description = "Research-screening engine: paper -> extracted strategy -> long-only backtest -> evaluation -> economics -> dossier"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "yfinance>=0.2.50",
  "pypdf>=4.0",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "streamlit>=1.35",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
engine = "research_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
